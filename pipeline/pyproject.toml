[project]
name = "findadoc-pipeline"
version = "0.1.0"
description = "Web-scraping pipeline for Find-a-Doc"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0.2",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
    "tenacity>=9.0",
    "apscheduler>=3.10",
    "playwright>=1.49",
    "playwright-stealth>=1.0.6",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.34",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "black>=24.10",
]

[project.scripts]
findadoc-pipeline = "pipeline.__main__:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that spin up Postgres or Playwright (excluded by default)",
]
addopts = "-m 'not slow'"
asyncio_mode = "auto"
