# --- Urology & men's health -------------------------------------------------

- slug: urinary-tract-infection
  name_ka: საშარდე გზების ინფექცია
  name_en: Urinary Tract Infection
  sort_order: 310
  specialties: [urology, internal-medicine, family-medicine]
  synonyms_en: [uti, bladder infection, cystitis]
  synonyms_ka: [შარდის ბუშტის ანთება, ცისტიტი, შარდვის პრობლემა]
  description_ka: |
    საშარდე გზების ინფექცია არის ბაქტერიული ინფექცია, რომელიც ყველაზე
    ხშირად შარდის ბუშტს აზიანებს. სიმპტომებია ხშირი და მტკივნეული შარდვა,
    წვის შეგრძნება და მღვრიე შარდი. ინფექცია, როგორც წესი, ეფექტურად იკურნება
    ანტიბიოტიკებით.
  description_en: |
    A urinary tract infection (UTI) is a bacterial infection that most commonly
    affects the bladder. Symptoms include frequent, painful urination, a burning
    sensation, and cloudy urine. UTIs are usually treated effectively with
    antibiotics.

- slug: kidney-stones
  name_ka: თირკმლის კენჭები
  name_en: Kidney Stones
  sort_order: 311
  specialties: [urology, nephrology]
  synonyms_en: [renal calculi, stones, nephrolithiasis]
  synonyms_ka: [თირკმლის კენჭოვანი დაავადება, ნეფროლითიაზი, კენჭები თირკმელში]
  description_ka: |
    თირკმლის კენჭები არის მაგარი წარმონაქმნები, რომლებიც წარმოიქმნება
    შარდში მინერალების კონცენტრაციის გამო. პატარა კენჭები შეიძლება უსიმპტომოდ
    გამოვიდეს, დიდები კი იწვევენ მძაფრ ტკივილს წელისა და გვერდის არეში.
    მკურნალობა მერყეობს ტკივილის მართვიდან ქირურგიულ ჩარევამდე.
  description_en: |
    Kidney stones are hard deposits that form from concentrated minerals in the
    urine. Small stones may pass unnoticed, while larger ones cause severe pain
    in the back and side. Treatment ranges from pain management to surgical
    removal.

- slug: benign-prostatic-hyperplasia
  name_ka: პროსტატის კეთილთვისებიანი ჰიპერპლაზია
  name_en: Benign Prostatic Hyperplasia
  sort_order: 312
  specialties: [urology, andrology]
  synonyms_en: [bph, enlarged prostate, prostate problem]
  synonyms_ka: [პროსტატის ადენომა, წინამდებარე ჯირკვლის გადიდება, პროსტატა]
  description_ka: |
    პროსტატის კეთილთვისებიანი ჰიპერპლაზია არის წინამდებარე ჯირკვლის
    არასიმსივნური გადიდება, რომელიც ასაკთან ერთად ვითარდება მამაკაცებში.
    გადიდებული ჯირკვალი აჭერს შარდის ნაკადს და იწვევს ხშირ, გაძნელებულ
    შარდვას. მკურნალობა მოიცავს მედიკამენტებსა და, საჭიროების შემთხვევაში,
    ქირურგიას.
  description_en: |
    Benign prostatic hyperplasia is a non-cancerous enlargement of the prostate
    gland that develops with age in men. The enlarged gland presses on the
    urethra, causing frequent and difficult urination. Treatment includes
    medication and, if needed, surgery.

