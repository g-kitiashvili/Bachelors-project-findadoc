- slug: sinusitis
  name_ka: სინუსიტი
  name_en: Sinusitis
  sort_order: 380
  specialties: [ent, allergology]
  synonyms_en: [sinus infection, blocked sinuses, sinus inflammation]
  synonyms_ka: [პარანაზალური სინუსების ანთება, ჰაიმორიტი, ცხვირის ღრუების ანთება]
  description_ka: |
    სინუსიტი არის ცხვირის გვერდითი ღრუების ანთება, რომელიც ხშირად
    გაცივების ან ალერგიის შემდეგ ვითარდება. სიმპტომებია ცხვირის გაჭედვა,
    სახის ტკივილი და სქელი გამონადენი. მსუბუქი შემთხვევა თავისით გადის,
    ბაქტერიული ინფექცია კი ანტიბიოტიკებს საჭიროებს.
  description_en: |
    Sinusitis is inflammation of the sinuses, often developing after a cold or
    due to allergies. Symptoms include a blocked nose, facial pain, and thick
    discharge. Mild cases clear on their own, while bacterial infections need
    antibiotics.

