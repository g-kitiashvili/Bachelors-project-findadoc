# --- Oncology (common cancers) ----------------------------------------------

- slug: breast-cancer
  name_ka: ძუძუს კიბო
  name_en: Breast Cancer
  sort_order: 530
  specialties: [oncology, mammology, surgery]
  synonyms_en: [breast tumor, breast lump]
  synonyms_ka: [ძუძუს სიმსივნე, სარძევე ჯირკვლის კიბო]
  description_ka: |
    ძუძუს კიბო ქალებში ყველაზე გავრცელებული ონკოლოგიური დაავადებაა.
    ადრეულ სტადიაზე ხშირად ვლინდება ძუძუში კვანძის სახით ან სკრინინგით.
    ადრეული გამოვლენა მნიშვნელოვნად აუმჯობესებს განკურნების შანსს.
    მკურნალობა შეიძლება აერთიანებდეს ქირურგიას, სხივურ თერაპიასა და მედიკამენტებს.
  description_en: |
    Breast cancer is the most common cancer among women. In early stages it
    often appears as a lump in the breast or is detected through screening. Early
    detection significantly improves the chance of a cure. Treatment may combine
    surgery, radiation, and medication.

