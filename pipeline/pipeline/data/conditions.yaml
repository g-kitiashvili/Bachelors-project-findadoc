# --- Ophthalmology ----------------------------------------------------------

- slug: cataracts
  name_ka: კატარაქტა
  name_en: Cataracts
  sort_order: 410
  specialties: [ophthalmology]
  synonyms_en: [cloudy lens, blurry vision]
  synonyms_ka: [თვალის ბურუსი, თვალის დაბინდვა, ბროლის დანისლვა]
  description_ka: |
    კატარაქტა არის თვალის ბუნებრივი ბროლის დამღვრევა, რომელიც ასაკთან
    ერთად ვითარდება და მხედველობას აბუნდოვანებს. სიმპტომებია ბუნდოვანი
    ხედვა, ფერების გახუნება და სინათლის მიმართ მგრძნობელობა. მკურნალობა
    ქირურგიულია — დამღვრეული ბროლი იცვლება ხელოვნურით.
  description_en: |
    A cataract is a clouding of the eye's natural lens that develops with age
    and blurs vision. Symptoms include hazy sight, fading colors, and
    sensitivity to light. Treatment is surgical — the clouded lens is replaced
    with an artificial one.

- slug: glaucoma
  name_ka: გლაუკომა
  name_en: Glaucoma
  sort_order: 411
  specialties: [ophthalmology]
  synonyms_en: [eye pressure, optic nerve damage]
  synonyms_ka: [გლაუკომა]
  description_ka: |
    გლაუკომა არის თვალის დაავადება, რომელიც აზიანებს მხედველობის ნერვს,
    ხშირად თვალის შიდა წნევის მომატების გამო. ის ნელ-ნელა იღებს გვერდით
    მხედველობას და მკურნალობის გარეშე შეიძლება გამოიწვიოს სიბრმავე. ადრეული
    მკურნალობა წვეთებით ან ქირურგიით იცავს მხედველობას.
  description_en: |
    Glaucoma is an eye disease that damages the optic nerve, often due to raised
    pressure inside the eye. It slowly erodes peripheral vision and can cause
    blindness if untreated. Early treatment with drops or surgery preserves
    sight.

