- slug: chronic-kidney-disease
  name_ka: თირკმლის ქრონიკული დაავადება
  name_en: Chronic Kidney Disease
  sort_order: 316
  specialties: [nephrology, internal-medicine]
  synonyms_en: [ckd, kidney failure, renal failure]
  synonyms_ka: [თირკმლის უკმარისობა, თირკმლის ქრონიკული უკმარისობა]
  description_ka: |
    თირკმლის ქრონიკული დაავადება არის თირკმლების ფუნქციის თანდათანობითი
    და შეუქცევადი დაქვეითება. ადრეულ სტადიაზე ხშირად უსიმპტომოა და ვლინდება
    სისხლისა და შარდის ანალიზებით. მთავარი მიზეზებია დიაბეტი და მაღალი წნევა.
    მკურნალობა ანელებს პროგრესირებას და მძიმე შემთხვევაში საჭიროა დიალიზი.
  description_en: |
    Chronic kidney disease is a gradual, irreversible decline in kidney
    function. It is often symptomless in early stages and detected through blood
    and urine tests. The main causes are diabetes and high blood pressure.
    Treatment slows progression, and advanced cases require dialysis.

