# --- Neurology --------------------------------------------------------------

- slug: migraine
  name_ka: მიგრენი
  name_en: Migraine
  sort_order: 190
  specialties: [neurology]
  synonyms_en: [severe headache, throbbing headache, headache]
  synonyms_ka: [თავის ძლიერი ტკივილი, ნახევარი თავის ტკივილი, თავის ტკივილი]
  description_ka: |
    მიგრენი არის ძლიერი, ხშირად პულსირებადი თავის ტკივილი, რომელიც
    ჩვეულებრივ თავის ერთ მხარეს ვითარდება და თან ახლავს გულისრევა,
    სინათლისა და ხმის მიმართ მგრძნობელობა. შეტევები შეიძლება გაგრძელდეს
    საათობით ან დღეობით. მკურნალობა მოიცავს შეტევის გამაყუჩებელ და
    პროფილაქტიკურ მედიკამენტებს.
  description_en: |
    A migraine is an intense, often throbbing headache, usually on one side of
    the head, accompanied by nausea and sensitivity to light and sound. Attacks
    can last hours or days. Treatment includes both acute pain-relief and
    preventive medication.

- slug: epilepsy
  name_ka: ეპილეფსია
  name_en: Epilepsy
  sort_order: 191
  specialties: [neurology, neurosurgery, pediatrics]
  synonyms_en: [seizures, seizure disorder, convulsions]
  synonyms_ka: [გულყრა, კრუნჩხვები, ეპილეფსიური შეტევები]
  description_ka: |
    ეპილეფსია არის ნევროლოგიური დაავადება, რომელსაც ახასიათებს განმეორებადი
    გულყრები — თავის ტვინში ელექტრული აქტივობის უეცარი აფეთქებები. შეტევები
    შეიძლება გამოვლინდეს კრუნჩხვებით ან ცნობიერების ხანმოკლე დაკარგვით.
    მკურნალობა უმეტეს შემთხვევაში ეფექტურად აკონტროლებს შეტევებს
    მედიკამენტებით.
  description_en: |
    Epilepsy is a neurological disorder marked by recurrent seizures — sudden
    bursts of electrical activity in the brain. Seizures may appear as
    convulsions or brief lapses of awareness. In most cases, medication controls
    the seizures effectively.

- slug: parkinsons-disease
  name_ka: პარკინსონის დაავადება
  name_en: Parkinson's Disease
  sort_order: 192
  specialties: [neurology]
  synonyms_en: [parkinsons, tremor, shaking]
  synonyms_ka: [პარკინსონი, კანკალი, ცახცახი]
  description_ka: |
    პარკინსონის დაავადება არის თავის ტვინის პროგრესირებადი დაავადება,
    რომელიც მოძრაობას აზიანებს. ძირითადი ნიშნებია კიდურების კანკალი,
    კუნთების სიხისტე და მოძრაობის შენელება. მკურნალობა ვერ კურნავს დაავადებას,
    მაგრამ მედიკამენტები მნიშვნელოვნად აუმჯობესებენ სიმპტომებსა და ცხოვრების
    ხარისხს.
  description_en: |
    Parkinson's disease is a progressive brain disorder that affects movement.
    Its hallmark signs are trembling limbs, muscle stiffness, and slowed
    movement. There is no cure, but medication significantly improves symptoms
    and quality of life.

