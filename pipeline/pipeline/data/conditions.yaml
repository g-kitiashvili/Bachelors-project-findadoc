# --- Dermatology ------------------------------------------------------------

- slug: acne
  name_ka: აკნე
  name_en: Acne
  sort_order: 250
  specialties: [dermatology, cosmetology]
  synonyms_en: [pimples, spots, breakouts]
  synonyms_ka: [მუწუკები, ბუგრები, კანის გამონაყარი, აკნე]
  description_ka: |
    აკნე არის კანის გავრცელებული მდგომარეობა, რომელიც ვითარდება, როდესაც
    ბეწვის ფოლიკულები იხშობა ცხიმითა და მკვდარი უჯრედებით. ის ვლინდება
    ბუგრებით, შავი წერტილებითა და ანთებითი მუწუკებით, ხშირად სახეზე, ზურგსა
    და მკერდზე. მკურნალობა მერყეობს ადგილობრივი საშუალებებიდან მედიკამენტებამდე.
  description_en: |
    Acne is a common skin condition that occurs when hair follicles become
    clogged with oil and dead cells. It appears as pimples, blackheads, and
    inflamed spots, often on the face, back, and chest. Treatment ranges from
    topical creams to oral medication.

- slug: eczema
  name_ka: ეგზემა
  name_en: Eczema
  sort_order: 251
  specialties: [dermatology, allergology]
  synonyms_en: [atopic dermatitis, itchy skin, dry skin rash]
  synonyms_ka: [ატოპიური დერმატიტი, კანის ქავილი, ეგზემა]
  description_ka: |
    ეგზემა (ატოპიური დერმატიტი) არის კანის ქრონიკული ანთებითი დაავადება,
    რომელიც იწვევს ქავილს, სიწითლესა და კანის სიმშრალეს. ხშირად იწყება
    ბავშვობაში და უკავშირდება ალერგიასა და ასთმას. მკურნალობა მოიცავს კანის
    დატენიანებასა და ანთების საწინააღმდეგო კრემებს.
  description_en: |
    Eczema (atopic dermatitis) is a chronic inflammatory skin condition that
    causes itching, redness, and dryness. It often begins in childhood and is
    linked to allergies and asthma. Treatment includes moisturizing the skin and
    anti-inflammatory creams.

