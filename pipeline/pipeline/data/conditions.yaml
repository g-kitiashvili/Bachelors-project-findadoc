- slug: stroke
  name_ka: ინსულტი
  name_en: Stroke
  sort_order: 111
  specialties: [neurology, neurosurgery, emergency-medicine]
  synonyms_en: [cerebrovascular accident, cva, brain attack]
  synonyms_ka: [თავის ტვინის ინსულტი, ცერებრალური ინსულტი, თავის ტვინის ინფარქტი]
  description_ka: |
    ინსულტი ვითარდება, როდესაც თავის ტვინის მკვებავი სისხლის ნაკადი წყდება
    ან არტერია სკდება. ეს იწვევს ტვინის უჯრედების სწრაფ დაზიანებას და
    მოითხოვს გადაუდებელ დახმარებას. სიმპტომებია სახის ასიმეტრია, ხელის
    სისუსტე და მეტყველების დარღვევა — ნებისმიერი მათგანის შემთხვევაში
    დაუყოვნებლივ უნდა გამოიძახოთ სასწრაფო.
  description_en: |
    A stroke occurs when blood flow to part of the brain is blocked or a vessel
    bursts, rapidly damaging brain cells and requiring emergency care. Warning
    signs include facial drooping, arm weakness, and slurred speech — call
    emergency services immediately if any appear.

# --- Endocrinology & metabolic ----------------------------------------------

- slug: type-2-diabetes
  name_ka: ტიპი 2 შაქრიანი დიაბეტი
  name_en: Type 2 Diabetes
  sort_order: 120
  specialties: [endocrinology, internal-medicine, family-medicine]
  synonyms_en: [diabetes, high blood sugar, t2dm, adult onset diabetes]
  synonyms_ka: [შაქრიანი დიაბეტი, დიაბეტი, შაქარი, მაღალი შაქარი]
  description_ka: |
    ტიპი 2 შაქრიანი დიაბეტი არის ქრონიკული მდგომარეობა, რომლის დროსაც
    ორგანიზმი ვეღარ იყენებს ინსულინს ეფექტურად და სისხლში შაქრის დონე
    იმატებს. დროთა განმავლობაში ის აზიანებს გულს, თირკმელებს, თვალებსა და
    ნერვებს. მკურნალობა ეფუძნება ჯანსაღ კვებას, ფიზიკურ აქტივობასა და
    მედიკამენტებს.
  description_en: |
    Type 2 diabetes is a chronic condition in which the body no longer uses
    insulin effectively, causing blood sugar to rise. Over time it damages the
    heart, kidneys, eyes, and nerves. Management is based on healthy eating,
    physical activity, and medication.

- slug: type-1-diabetes
  name_ka: ტიპი 1 შაქრიანი დიაბეტი
  name_en: Type 1 Diabetes
  sort_order: 121
  specialties: [endocrinology, pediatrics, internal-medicine]
  synonyms_en: [diabetes, insulin dependent diabetes, t1dm, juvenile diabetes]
  synonyms_ka: [შაქრიანი დიაბეტი, დიაბეტი, ინსულინდამოკიდებული დიაბეტი]
  description_ka: |
    ტიპი 1 შაქრიანი დიაბეტი არის აუტოიმუნური დაავადება, რომლის დროსაც
    ორგანიზმი აღარ გამოიმუშავებს ინსულინს. ის ჩვეულებრივ ვლინდება ბავშვობასა
    და ახალგაზრდა ასაკში. პაციენტებს მთელი ცხოვრების მანძილზე ესაჭიროებათ
    ინსულინის ინექციები და სისხლში შაქრის რეგულარული კონტროლი.
  description_en: |
    Type 1 diabetes is an autoimmune disease in which the body stops producing
    insulin, usually appearing in childhood or young adulthood. Patients require
    lifelong insulin injections and regular blood-sugar monitoring to stay
    healthy.

- slug: hypothyroidism
  name_ka: ჰიპოთირეოზი
  name_en: Hypothyroidism
  sort_order: 122
  specialties: [endocrinology, internal-medicine]
  synonyms_en: [underactive thyroid, low thyroid, thyroid problem]
  synonyms_ka: [ფარისებრი ჯირკვლის ფუნქციის დაქვეითება, ფარისებრი ჯირკვალი]
  description_ka: |
    ჰიპოთირეოზი ვითარდება, როდესაც ფარისებრი ჯირკვალი საკმარის ჰორმონს ვერ
    გამოიმუშავებს. ეს ანელებს ორგანიზმის მეტაბოლიზმს და იწვევს დაღლილობას,
    წონის მატებას, სიცივის შეგრძნებასა და დეპრესიას. მკურნალობა მარტივია —
    ჰორმონის ყოველდღიური ჩანაცვლება ტაბლეტის სახით.
  description_en: |
    Hypothyroidism occurs when the thyroid gland does not produce enough
    hormone, slowing the body's metabolism. It causes fatigue, weight gain,
    sensitivity to cold, and depression. Treatment is simple — a daily hormone
    replacement tablet.

