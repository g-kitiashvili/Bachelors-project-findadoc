# Medical conditions for Find-a-Doc. Seeded into `medical_condition` + `condition_specialty`
# by MedicalConditionSeeder (run after seed-specialties). NYU-Langone-style "Conditions"
# coverage, adapted for the Georgian market.
#
# Every `specialties` slug must exist in specialties.yaml. The ~30 most common conditions
# carry curated KA + EN descriptions; the long tail is name + specialties + synonyms only.
# `sort_order` roughly groups conditions by specialty area (long tail defaults to 1000).

# --- Cardiology & vascular ---------------------------------------------------
- slug: hypertension
  name_ka: არტერიული ჰიპერტენზია
  name_en: Hypertension
  sort_order: 100
  specialties: [cardiology, internal-medicine, family-medicine]
  synonyms_en: [high blood pressure, blood pressure, htn]
  synonyms_ka: [მაღალი წნევა, არტერიული წნევა, წნევა, მომატებული წნევა]
  description_ka: |
    არტერიული ჰიპერტენზია არის მდგომარეობა, რომლის დროსაც სისხლის წნევა
    არტერიების კედლებზე მუდმივად მომატებულია. ხშირად მიმდინარეობს უსიმპტომოდ,
    მაგრამ მკურნალობის გარეშე ზრდის ინფარქტის, ინსულტისა და თირკმლის
    დაავადების რისკს. მკურნალობა მოიცავს ცხოვრების წესის შეცვლასა და მედიკამენტებს.
  description_en: |
    Hypertension is a condition in which the force of blood against the artery
    walls is persistently too high. It is often symptomless but, if untreated,
    raises the risk of heart attack, stroke, and kidney disease. Treatment
    combines lifestyle changes with medication.

- slug: coronary-artery-disease
  name_ka: კორონარული არტერიების დაავადება
  name_en: Coronary Artery Disease
  sort_order: 101
  specialties: [cardiology, cardiac-surgery]
  synonyms_en: [cad, ischemic heart disease, blocked arteries, heart disease]
  synonyms_ka: [გულის იშემიური დაავადება, იშემია, გულის დაავადება]
  description_ka: |
    კორონარული არტერიების დაავადება ვითარდება, როდესაც გულის კვებაზე
    პასუხისმგებელი არტერიები ვიწროვდება ქოლესტერინის ნადებების გამო. ეს იწვევს
    გულმკერდის ტკივილს (სტენოკარდიას) და შეიძლება გამოიწვიოს მიოკარდიუმის
    ინფარქტი. მკურნალობა მოიცავს მედიკამენტებს, სტენტირებას ან შუნტირებას.
  description_en: |
    Coronary artery disease develops when the arteries supplying the heart
    narrow due to cholesterol plaque buildup. It causes chest pain (angina) and
    can lead to a heart attack. Treatment ranges from medication to stenting or
    bypass surgery.

- slug: heart-failure
  name_ka: გულის უკმარისობა
  name_en: Heart Failure
  sort_order: 102
  specialties: [cardiology, internal-medicine]
  synonyms_en: [congestive heart failure, chf, weak heart]
  synonyms_ka: [გულის შეგუბებითი უკმარისობა, სუსტი გული]
  description_ka: |
    გულის უკმარისობა ნიშნავს, რომ გული ვეღარ ამოტუმბავს სისხლს ორგანიზმის
    მოთხოვნის დასაკმაყოფილებლად. სიმპტომებია ქოშინი, დაღლილობა და ფეხების
    შეშუპება. მკურნალობა მიმართულია სიმპტომების კონტროლსა და დაავადების
    პროგრესირების შენელებაზე მედიკამენტებითა და ცხოვრების წესის ცვლილებით.
  description_en: |
    Heart failure means the heart cannot pump enough blood to meet the body's
    needs. Symptoms include shortness of breath, fatigue, and swelling in the
    legs. Treatment focuses on controlling symptoms and slowing progression with
    medication and lifestyle changes.

- slug: arrhythmia
  name_ka: არითმია
  name_en: Arrhythmia
  sort_order: 103
  specialties: [cardiology]
  synonyms_en: [irregular heartbeat, heart rhythm disorder, palpitations]
  synonyms_ka: [არარეგულარული გულისცემა, რიტმის დარღვევა, გულის ფრიალი]
  description_ka: |
    არითმია არის გულისცემის რიტმის დარღვევა — გული შეიძლება ცემდეს ძალიან
    სწრაფად, ნელა ან არარეგულარულად. ზოგი არითმია უსაფრთხოა, ზოგი კი
    საშიში. დიაგნოსტიკა ხდება ეკგ-ით და მკურნალობა მოიცავს მედიკამენტებს,
    კარდიოვერსიას ან გულის რიტმის მართველის ჩანერგვას.
  description_en: |
    An arrhythmia is an irregular heart rhythm — the heart may beat too fast,
    too slow, or erratically. Some arrhythmias are harmless while others are
    dangerous. Diagnosis is by ECG, and treatment may include medication,
    cardioversion, or an implanted device such as a pacemaker.

- slug: atrial-fibrillation
  name_ka: წინაგულების ფიბრილაცია
  name_en: Atrial Fibrillation
  sort_order: 104
  specialties: [cardiology]
  synonyms_en: [afib, irregular heartbeat]
  synonyms_ka: [წინაგულების მოციმციმე არითმია, არითმია]

- slug: high-cholesterol
  name_ka: ჰიპერქოლესტერინემია
  name_en: High Cholesterol
  sort_order: 105
  specialties: [cardiology, internal-medicine, endocrinology]
  synonyms_en: [hypercholesterolemia, dyslipidemia, high lipids]
  synonyms_ka: [მაღალი ქოლესტერინი, დისლიპიდემია, ქოლესტერინი]
  description_ka: |
    მაღალი ქოლესტერინი ნიშნავს სისხლში ცხიმოვანი ნივთიერებების მომატებულ
    დონეს, რაც ზრდის არტერიების დახშობისა და გულის დაავადების რისკს.
    მდგომარეობა უსიმპტომოა და ვლინდება სისხლის ანალიზით. მკურნალობა მოიცავს
    დიეტას, ფიზიკურ აქტივობას და საჭიროების შემთხვევაში სტატინებს.
  description_en: |
    High cholesterol means elevated levels of fatty substances in the blood,
    which increase the risk of clogged arteries and heart disease. It causes no
    symptoms and is found through a blood test. Treatment includes diet,
    exercise, and statin medication when needed.

