- slug: influenza
  name_ka: გრიპი
  name_en: Influenza
  sort_order: 470
  specialties: [infectious-diseases, internal-medicine, family-medicine]
  synonyms_en: [flu, seasonal flu]
  synonyms_ka: [გრიპი, სეზონური გრიპი]
  description_ka: |
    გრიპი არის სასუნთქი გზების ვირუსული ინფექცია, რომელიც სწრაფად
    ვრცელდება და სეზონურ ეპიდემიებს იწვევს. სიმპტომებია მაღალი სიცხე,
    კუნთების ტკივილი, ხველა და ძლიერი დაღლილობა. უმეტესად თავისით
    გაივლის; ვაქცინაცია საუკეთესო პრევენციაა.
  description_en: |
    Influenza is a viral respiratory infection that spreads rapidly and causes
    seasonal epidemics. Symptoms include high fever, muscle aches, cough, and
    severe fatigue. It usually resolves on its own; vaccination is the best
    prevention.

