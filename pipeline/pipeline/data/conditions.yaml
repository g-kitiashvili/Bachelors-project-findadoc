  synonyms_ka: [ფარისებრი ჯირკვლის ფუნქციის მომატება, ფარისებრი ჯირკვალი]

- slug: thyroid-nodules
  name_ka: ფარისებრი ჯირკვლის კვანძები
  name_en: Thyroid Nodules
  sort_order: 124
  specialties: [endocrinology, surgery]
  synonyms_en: [thyroid lumps, goiter]
  synonyms_ka: [ფარისებრი ჯირკვლის კვანძი, ჩიჩახვი]

- slug: obesity
  name_ka: სიმსუქნე
  name_en: Obesity
  sort_order: 125
  specialties: [endocrinology, nutrition, internal-medicine]
  synonyms_en: [overweight, weight problem, excess weight]
  synonyms_ka: [ჭარბი წონა, წონის ჭარბი მატება, სიმსუქნის პრობლემა]
  description_ka: |
    სიმსუქნე არის ჭარბი ცხიმის დაგროვება ორგანიზმში, რაც ზრდის დიაბეტის,
    გულის დაავადებისა და სახსრების პრობლემების რისკს. ის ვითარდება
    კალორიების ჭარბი მიღების, ფიზიკური უმოქმედობისა და გენეტიკური
    ფაქტორების ერთობლიობით. მკურნალობა მოიცავს კვების კორექციას, ფიზიკურ
    აქტივობას და ზოგ შემთხვევაში მედიკამენტებს ან ქირურგიას.
  description_en: |
    Obesity is the accumulation of excess body fat, which raises the risk of
    diabetes, heart disease, and joint problems. It develops from a combination
    of excess calorie intake, inactivity, and genetic factors. Treatment
    includes dietary change, physical activity, and sometimes medication or
    surgery.

