# --- Gastroenterology -------------------------------------------------------

- slug: gerd
  name_ka: გასტროეზოფაგური რეფლუქსური დაავადება
  name_en: GERD
  sort_order: 160
  specialties: [gastroenterology, internal-medicine]
  synonyms_en: [acid reflux, heartburn, reflux, gastroesophageal reflux]
  synonyms_ka: [მჟავას რეფლუქსი, გულძმარვა, რეფლუქსი, მჟავას უკუგდება]
  description_ka: |
    გასტროეზოფაგური რეფლუქსური დაავადება (GERD) ვითარდება, როდესაც კუჭის
    მჟავა რეგულარულად ბრუნდება საყლაპავ მილში და იწვევს გულძმარვას. ხშირი
    სიმპტომებია წვის შეგრძნება გულმკერდის არეში და მჟავას გემო პირში.
    მკურნალობა მოიცავს კვების ჩვევების შეცვლასა და მჟავას შემამცირებელ
    მედიკამენტებს.
  description_en: |
    Gastroesophageal reflux disease (GERD) occurs when stomach acid repeatedly
    flows back into the esophagus, causing heartburn. Common symptoms are a
    burning sensation in the chest and a sour taste in the mouth. Treatment
    involves changing eating habits and taking acid-reducing medication.

- slug: peptic-ulcer
  name_ka: კუჭ-ნაწლავის წყლული
  name_en: Peptic Ulcer
  sort_order: 161
  specialties: [gastroenterology, internal-medicine]
  synonyms_en: [stomach ulcer, gastric ulcer, ulcer]
  synonyms_ka: [კუჭის წყლული, წყლული, თორმეტგოჯა ნაწლავის წყლული]
  description_ka: |
    კუჭ-ნაწლავის წყლული არის ღია ჭრილობა კუჭის ან თორმეტგოჯა ნაწლავის
    შიდა ზედაპირზე, რომელსაც ხშირად H. pylori ბაქტერია ან ტკივილგამაყუჩებელი
    წამლები იწვევს. სიმპტომებია მუცლის წვა და ტკივილი. მკურნალობა მოიცავს
    ანტიბიოტიკებსა და მჟავას შემამცირებელ პრეპარატებს.
  description_en: |
    A peptic ulcer is an open sore on the inner lining of the stomach or
    duodenum, often caused by H. pylori bacteria or pain-relief drugs. Symptoms
    include a burning stomach ache and pain. Treatment combines antibiotics with
    acid-reducing medication.

- slug: irritable-bowel-syndrome
  name_ka: გაღიზიანებული ნაწლავის სინდრომი
  name_en: Irritable Bowel Syndrome
  sort_order: 162
  specialties: [gastroenterology]
  synonyms_en: [ibs, spastic colon, nervous stomach]
  synonyms_ka: [ნაწლავის გაღიზიანების სინდრომი, სპასტიკური კოლიტი]
  description_ka: |
    გაღიზიანებული ნაწლავის სინდრომი (IBS) არის ნაწლავის ფუნქციური დარღვევა,
    რომელიც იწვევს მუცლის ტკივილს, შებერილობას, ფაღარათსა და ყაბზობას.
    სიმპტომები ხშირად უკავშირდება სტრესსა და კვებას. მკურნალობა ფოკუსირებულია
    დიეტის კორექციასა და სიმპტომების მართვაზე.
  description_en: |
    Irritable bowel syndrome (IBS) is a functional bowel disorder that causes
    abdominal pain, bloating, diarrhea, and constipation. Symptoms are often
    linked to stress and diet. Management focuses on dietary adjustment and
    symptom control.

