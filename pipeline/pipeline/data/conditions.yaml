  synonyms_ka: [სისხლნაკლებობა, რკინადეფიციტური ანემია, ჰემოგლობინის დაქვეითება]
  description_ka: |
    ანემია არის მდგომარეობა, რომლის დროსაც სისხლში წითელი უჯრედების ან
    ჰემოგლობინის რაოდენობა შემცირებულია. ეს იწვევს დაღლილობას,
    სიფერმკრთალესა და ქოშინს. ყველაზე ხშირი მიზეზი რკინის დეფიციტია,
    რომელიც დანამატებით იკურნება.
  description_en: |
    Anemia is a condition in which the number of red blood cells or the level of
    hemoglobin in the blood is reduced. It causes fatigue, pale skin, and
    shortness of breath. The most common cause is iron deficiency, which is
    treated with supplements.

