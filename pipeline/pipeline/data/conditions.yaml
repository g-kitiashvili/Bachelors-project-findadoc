- slug: osteoporosis
  name_ka: ოსტეოპოროზი
  name_en: Osteoporosis
  sort_order: 127
  specialties: [endocrinology, rheumatology, orthopedics]
  synonyms_en: [brittle bones, bone loss, low bone density]
  synonyms_ka: [ძვლის სიმკვრივის დაქვეითება, ძვლების გათხელება, მტვრევადი ძვლები]
  description_ka: |
    ოსტეოპოროზი არის მდგომარეობა, რომლის დროსაც ძვლები კარგავს სიმკვრივეს
    და ხდება მტვრევადი. ხშირად უსიმპტომოა მანამ, სანამ მოულოდნელი მოტეხილობა
    არ მოხდება, განსაკუთრებით მენოპაუზის შემდგომ ქალებში. პრევენცია და
    მკურნალობა მოიცავს კალციუმს, D ვიტამინს, ფიზიკურ აქტივობასა და მედიკამენტებს.
  description_en: |
    Osteoporosis is a condition in which bones lose density and become fragile.
    It is often silent until a sudden fracture occurs, especially in
    postmenopausal women. Prevention and treatment include calcium, vitamin D,
    weight-bearing exercise, and medication.

