  synonyms_en: [low sperm count]
  synonyms_ka: [სპერმის ხარისხის დარღვევა, მამაკაცის უშვილობა]

# --- Orthopedics & musculoskeletal ------------------------------------------

- slug: osteoarthritis
  name_ka: ოსტეოართრიტი
  name_en: Osteoarthritis
  sort_order: 340
  specialties: [orthopedics, rheumatology]
  synonyms_en: [arthritis, joint wear, degenerative joint disease]
  synonyms_ka: [ართროზი, სახსრის ცვეთა, სახსრების ტკივილი, ართრიტი]
  description_ka: |
    ოსტეოართრიტი არის სახსრების ყველაზე გავრცელებული დაავადება, რომელიც
    ვითარდება ხრტილის თანდათანობითი ცვეთის შედეგად. ის იწვევს სახსრის ტკივილს,
    სიხისტესა და მოძრაობის შეზღუდვას, განსაკუთრებით მუხლებში, თეძოსა და
    ხელებში. მკურნალობა მოიცავს ვარჯიშს, წონის კონტროლსა და ტკივილგამაყუჩებლებს.
  description_en: |
    Osteoarthritis is the most common joint disease, caused by the gradual
    wearing away of cartilage. It produces joint pain, stiffness, and limited
    movement, especially in the knees, hips, and hands. Treatment includes
    exercise, weight control, and pain relief.

- slug: rheumatoid-arthritis
  name_ka: რევმატოიდული ართრიტი
  name_en: Rheumatoid Arthritis
  sort_order: 341
  specialties: [rheumatology]
  synonyms_en: [ra, autoimmune arthritis, joint inflammation]
  synonyms_ka: [რევმატოიდული ართრიტი, აუტოიმუნური ართრიტი, სახსრების ანთება]
  description_ka: |
    რევმატოიდული ართრიტი არის აუტოიმუნური დაავადება, რომლის დროსაც იმუნური
    სისტემა უტევს სახსრების გარსს და იწვევს ანთებას. ის იწვევს სიმეტრიულ
    სახსრის ტკივილს, შეშუპებასა და დილის სიხისტეს. ადრეული მკურნალობა
    მედიკამენტებით ანელებს სახსრების დაზიანებას.
  description_en: |
    Rheumatoid arthritis is an autoimmune disease in which the immune system
    attacks the joint lining, causing inflammation. It produces symmetric joint
    pain, swelling, and morning stiffness. Early treatment with medication slows
    joint damage.

- slug: low-back-pain
  name_ka: წელის ტკივილი
  name_en: Low Back Pain
  sort_order: 342
  specialties: [orthopedics, neurology, physical-medicine]
  synonyms_en: [back pain, lumbago, lower back pain]
  synonyms_ka: [ზურგის ტკივილი, წელის ტკივილი, ლუმბაგო]
  description_ka: |
    წელის ტკივილი ერთ-ერთი ყველაზე გავრცელებული საჩივარია, რომელიც
    შეიძლება გამოწვეული იყოს კუნთების დაჭიმვით, მალთაშუა დისკის პრობლემით
    ან არასწორი მდგომარეობით. უმეტეს შემთხვევაში ის თავისით ან ფიზიკური
    თერაპიით უმჯობესდება. ხანგრძლივი ან ძლიერი ტკივილი ექიმის შემოწმებას
    საჭიროებს.
  description_en: |
    Low back pain is one of the most common complaints and can be caused by
    muscle strain, disc problems, or poor posture. In most cases it improves on
    its own or with physical therapy. Persistent or severe pain warrants a
    medical evaluation.

