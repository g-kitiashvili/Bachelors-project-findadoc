- slug: allergic-rhinitis
  name_ka: ალერგიული რინიტი
  name_en: Allergic Rhinitis
  sort_order: 385
  specialties: [allergology, ent]
  synonyms_en: [hay fever, nasal allergy, runny nose]
  synonyms_ka: [თივის ცხელება, ცხვირის ალერგია, ალერგიული სურდო]
  description_ka: |
    ალერგიული რინიტი არის ცხვირის ლორწოვანის ალერგიული ანთება,
    რომელსაც იწვევს მტვერი, ყვავილის მტვერი ან ცხოველის ბეწვი. სიმპტომებია
    ცემინება, ცხვირიდან გამონადენი და ცხვირის გაჭედვა. მკურნალობა მოიცავს
    ანტიჰისტამინებსა და ალერგენის თავიდან აცილებას.
  description_en: |
    Allergic rhinitis is an allergic inflammation of the nasal lining triggered
    by dust, pollen, or animal dander. Symptoms include sneezing, a runny nose,
    and nasal congestion. Treatment includes antihistamines and avoiding the
    allergen.

- slug: deviated-septum
  name_ka: ცხვირის ძგიდის გამრუდება
  name_en: Deviated Septum
  sort_order: 386
