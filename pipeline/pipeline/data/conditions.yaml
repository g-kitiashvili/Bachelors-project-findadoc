# --- Psychiatry & mental health ---------------------------------------------

- slug: depression
  name_ka: დეპრესია
  name_en: Depression
  sort_order: 220
  specialties: [psychiatry, psychology]
  synonyms_en: [major depressive disorder, low mood, sadness]
  synonyms_ka: [დეპრესიული აშლილობა, დათრგუნულობა, ცუდი ხასიათი]
  description_ka: |
    დეპრესია არის ფსიქიკური ჯანმრთელობის აშლილობა, რომელსაც ახასიათებს
    მუდმივი სევდა, ინტერესის დაკარგვა და ენერგიის დაქვეითება ორ კვირაზე
    მეტი ხნის განმავლობაში. ის გავლენას ახდენს ძილზე, მადასა და
    კონცენტრაციაზე. მკურნალობა ეფექტურია ფსიქოთერაპიითა და, საჭიროების
    შემთხვევაში, ანტიდეპრესანტებით.
  description_en: |
    Depression is a mental health disorder marked by persistent sadness, loss
    of interest, and low energy lasting more than two weeks. It affects sleep,
    appetite, and concentration. Treatment is effective with psychotherapy and,
    when needed, antidepressant medication.

- slug: anxiety-disorder
  name_ka: შფოთვითი აშლილობა
  name_en: Anxiety Disorder
  sort_order: 221
  specialties: [psychiatry, psychology]
  synonyms_en: [anxiety, panic, generalized anxiety, worry]
  synonyms_ka: [შფოთვა, პანიკა, განგაში, მღელვარება]
  description_ka: |
    შფოთვითი აშლილობა არის მდგომარეობა, რომელსაც ახასიათებს ჭარბი და
    მუდმივი შიში ან წუხილი, რომელიც ხელს უშლის ყოველდღიურ ცხოვრებას.
    სიმპტომები მოიცავს გულის ფრიალს, დაძაბულობასა და ძილის დარღვევას.
    მკურნალობა მოიცავს ფსიქოთერაპიასა და მედიკამენტებს.
  description_en: |
    An anxiety disorder is a condition marked by excessive and persistent fear
    or worry that interferes with daily life. Symptoms include a racing heart,
    tension, and disturbed sleep. Treatment combines psychotherapy with
    medication.

