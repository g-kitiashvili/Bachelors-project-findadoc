# --- Pulmonology & respiratory ----------------------------------------------

- slug: asthma
  name_ka: ბრონქული ასთმა
  name_en: Asthma
  sort_order: 140
  specialties: [pulmonology, allergology, pediatrics]
  synonyms_en: [wheezing, breathing problem, bronchial asthma]
  synonyms_ka: [ასთმა, ხიხინი, სუნთქვის გაძნელება]
  description_ka: |
    ბრონქული ასთმა არის სასუნთქი გზების ქრონიკული ანთებითი დაავადება,
    რომელიც იწვევს ბრონქების შევიწროებას, ხიხინს, ხველასა და ქოშინს.
    შეტევები შეიძლება გამოიწვიოს ალერგენებმა, ინფექციამ ან ფიზიკურმა
    დატვირთვამ. მკურნალობა ხდება საინჰალაციო პრეპარატებით, რომლებიც
    აკონტროლებენ ანთებას და ხსნიან ბრონქოსპაზმს.
  description_en: |
    Asthma is a chronic inflammatory airway disease that causes the bronchial
    tubes to narrow, producing wheezing, coughing, and shortness of breath.
    Attacks can be triggered by allergens, infection, or exercise. Treatment
    uses inhalers that control inflammation and relieve bronchospasm.

- slug: copd
  name_ka: ფილტვების ქრონიკული ობსტრუქციული დაავადება
  name_en: COPD
  sort_order: 141
  specialties: [pulmonology, internal-medicine]
  synonyms_en: [chronic obstructive pulmonary disease, emphysema, smokers lung]
  synonyms_ka: [ფქოდ, ემფიზემა, მწეველის ფილტვი]
  description_ka: |
    ფილტვების ქრონიკული ობსტრუქციული დაავადება (ფქოდ) არის სასუნთქი გზების
    პროგრესირებადი დაავადება, რომელიც ართულებს სუნთქვას. მისი მთავარი მიზეზი
    თამბაქოს მოწევაა. სიმპტომებია ქრონიკული ხველა, ნახველი და ქოშინი.
    მკურნალობა ანელებს დაავადების პროგრესირებას, მაგრამ მოწევის შეწყვეტა
    ყველაზე მნიშვნელოვანია.
  description_en: |
    Chronic obstructive pulmonary disease (COPD) is a progressive airway
    disease that makes breathing difficult, most often caused by smoking.
    Symptoms include a chronic cough, phlegm, and breathlessness. Treatment
    slows progression, but quitting smoking matters most.

- slug: pneumonia
  name_ka: პნევმონია
  name_en: Pneumonia
  sort_order: 142
  specialties: [pulmonology, infectious-diseases, internal-medicine]
  synonyms_en: [lung infection, chest infection]
  synonyms_ka: [ფილტვების ანთება, ფილტვის ინფექცია]
  description_ka: |
    პნევმონია არის ფილტვების ინფექცია, რომელიც იწვევს ჰაერის პატარა
    პარკების ანთებას და სითხით ავსებას. სიმპტომებია სიცხე, ხველა ნახველით,
    გულმკერდის ტკივილი და ქოშინი. გამომწვევი მიზეზის მიხედვით მკურნალობა
    ხდება ანტიბიოტიკებით ან ანტივირუსული პრეპარატებით.
  description_en: |
    Pneumonia is an infection of the lungs that inflames the air sacs and fills
    them with fluid. Symptoms include fever, a cough with phlegm, chest pain,
    and shortness of breath. Depending on the cause, it is treated with
    antibiotics or antiviral medication.

