# Region/city taxonomy for Find-a-Doc. Seeded into the `location` table by LocationSeeder.
# Top-level entries are regions (parent_id NULL). Nested `cities` become child rows.
# Cities are the municipality seats; the list is the country's full set so geocode
# city-detection resolves a clinic named for any town instead of defaulting to Tbilisi.
# Tbilisi is a self-governing city = its own region, so it has no child cities.

