  sort_order: 80
  description_ka: |
    ოტორინოლარინგოლოგია (ყელ-ყურ-ცხვირის სამედიცინო სპეციალობა) ეხება
    ყურის, ცხვირისა და ყელის დაავადებებს.
  description_en: |
    Otorhinolaryngology (ENT) is the medical specialty dealing with disorders of
    the ear, nose, and throat.

