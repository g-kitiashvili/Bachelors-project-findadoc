# Specialty taxonomy for Find-a-Doc. Seeded into the `specialty` table by SpecialtySeeder.
# Top-10 entries carry curated KA + EN descriptions; long-tail entries have name only.

- slug: cardiology
  name_ka: კარდიოლოგია
  name_en: Cardiology
  aliases: [არითმოლოგი, არითმოლოგიის]
  sort_order: 10
  description_ka: |
    კარდიოლოგია არის სამედიცინო სპეციალობა, რომელიც სწავლობს გულისა და
    სისხლძარღვების დაავადებებს. კარდიოლოგი ექიმები სვამენ დიაგნოზს და
    მკურნალობენ მდგომარეობებს არითმიიდან კორონარული არტერიის დაავადებამდე.
  description_en: |
    Cardiology is the medical specialty concerned with disorders of the heart and
    blood vessels. Cardiologists diagnose and treat conditions ranging from
    arrhythmias to coronary artery disease, and often coordinate care with
    cardiac surgeons for interventional procedures.

- slug: pediatrics
  name_ka: პედიატრია
  name_en: Pediatrics
  sort_order: 20
  description_ka: |
    პედიატრია არის სამედიცინო სპეციალობა, რომელიც ეხება ჩვილების, ბავშვებისა
    და მოზარდების ჯანმრთელობას, ფიზიკურ და ფსიქოლოგიურ განვითარებას.
  description_en: |
    Pediatrics is the medical specialty dealing with the health and medical care
    of infants, children, and adolescents from birth up to age 18. Pediatricians
    provide preventive care, diagnose and treat illnesses, and monitor growth and
    development.

- slug: gynecology
  name_ka: გინეკოლოგია
  name_en: Gynecology
  sort_order: 30
  description_ka: |
    გინეკოლოგია არის სამედიცინო სპეციალობა, რომელიც ეხება ქალთა
    რეპროდუქციული სისტემის ჯანმრთელობას.
  description_en: |
    Gynecology is the medical specialty dealing with the health of the female
    reproductive system, including the uterus, ovaries, and fallopian tubes.

- slug: dermatology
  name_ka: დერმატოლოგია
  name_en: Dermatology
  sort_order: 40
  description_ka: |
    დერმატოლოგია არის სამედიცინო სპეციალობა, რომელიც ეხება კანის, თმის
    და ფრჩხილების დაავადებებს.
  description_en: |
    Dermatology is the medical specialty concerned with the diagnosis and
    treatment of conditions affecting the skin, hair, and nails.

- slug: surgery
  name_ka: ქირურგია
  name_en: Surgery
  aliases: [ტრანსპლანტოლოგი]
  sort_order: 50
  description_ka: |
    ქირურგია არის სამედიცინო სპეციალობა, რომელიც იყენებს ოპერაციულ
    ტექნიკას ტრავმის, დაავადებებისა და დეფორმაციების სამკურნალოდ.
  description_en: |
    Surgery is the medical specialty that uses operative techniques to treat
    injuries, diseases, and deformities.

- slug: internal-medicine
  name_ka: შინაგანი მედიცინა
  name_en: Internal Medicine
  aliases: [თერაპევტი, აკადემიური თერაპევტი]
  sort_order: 60
  description_ka: |
    შინაგანი მედიცინა არის სამედიცინო სპეციალობა, რომელიც ეხება
    ზრდასრულთა შინაგანი დაავადებების პრევენციას, დიაგნოსტიკას და
    მკურნალობას.
  description_en: |
    Internal Medicine is the medical specialty concerned with the prevention,
    diagnosis, and treatment of internal diseases in adults.

- slug: neurology
  name_ka: ნევროლოგია
  name_en: Neurology
  sort_order: 70
  description_ka: |
    ნევროლოგია არის სამედიცინო სპეციალობა, რომელიც ეხება ნერვული
    სისტემის დაავადებებს.
  description_en: |
    Neurology is the medical specialty concerned with the diagnosis and treatment
    of disorders of the nervous system, including the brain, spinal cord, and
    peripheral nerves.

- slug: ent
