spring:
  application:
    name: findadoc-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/findadoc}
    username: ${DATABASE_USERNAME:findadoc}
    password: ${DATABASE_PASSWORD:findadoc}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.findadoc: DEBUG
